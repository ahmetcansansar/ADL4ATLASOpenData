# SingleTopAnalysis: input samples, normalisation and merge groups.
#
# samples:  ntuple path relative to ntuple_base_url; for MC the cross-section [pb],
#           sum of weights and filter efficiency. Each MC sample is scaled by
#           1/(sumw*eff) after the run (XSection and Lumi are applied in the ADL).
# groups:   samples summed by scripts/normalize_merge.py into <outdir>/<group>.root.
analysis: SingleTopAnalysis
adl: analyses/SingleTopAnalysis/SingleTopAnalysis.adl
ntuple_base_url: http://opendata.cern.ch/eos/opendata/atlas/OutreachDatasets/2020-01-22
normalisation:
  source: ATLAS Open Data 13 TeV C++ framework v1.1, Plotting/inputfiles/Files_WBoson.txt
  formula: MC histograms x 1/(sumw*eff); Lumi and XSection are applied per event in the ADL
